<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download My App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b0e14;
      color: #e7ecf5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111725;
      border: 1px solid #232c42;
      border-radius: 20px;
      padding: 36px 26px;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,.8);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -.02em;
    }
    p {
      margin: 0 0 26px;
      color: #8b97ad;
      font-size: 15px;
      line-height: 1.55;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      background: #5b8cff;
      color: #0b0e14;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: transform .12s, background .18s;
    }
    .btn:hover {
      background: #7aa2ff;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn svg {
      width: 20px;
      height: 20px;
    }
    .note {
      margin-top: 16px;
      font-size: 12.5px;
      color: #8b97ad;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>My App</h1>
    <p>Download the latest Android APK directly to your phone.</p>

    <!-- This links to apps.apk in the SAME directory -->
    <a class="btn" href="xdrive.apk" download="xdrive.apk" type="application/vnd.android.package-archive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/>
        <path d="m7 10 5 5 5-5"/>
        <path d="M4 19h16"/>
      </svg>
      Download APK
    </a>

    <p class="note">Android 8+ · Direct download</p>
  </main>
</body>
</html>
